; Codex Desk Companion - LILYGO T-Display-S3 firmware
;
; Board id `lilygo-t-display-s3` is provided by the installed espressif32
; platform (verified with `pio boards lilygo`). Its board JSON already sets
; flash_size 16MB, partitions default_16MB.csv, memory_type qio_opi and the
; USB CDC flags; the explicit values below restate them so this file is
; self-describing and survives a board-definition change.

[platformio]
default_envs = tdisplays3

[env:tdisplays3]
platform = espressif32@7.1.1
board = lilygo-t-display-s3
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS
; The USB CDC this board logs to is the same port the protocol runs on, so any
; Arduino HAL log_e() reaching it is stray noise in the host's line stream. The
; Preferences library emits one on every boot of a board that has not been
; named yet (no NVS namespace, no key), which is the out-of-the-box state of
; all 14 units. 0 compiles those calls out; the firmware's own "err:" lines are
; plain Serial.println and are unaffected.
    -DCORE_DEBUG_LEVEL=0
; UNIT_ID is intentionally NOT set here, and tools/flash-all.sh no longer passes
; it either: every unit is flashed with the byte-identical image so the fleet has
; one binary and one hash. With UNIT_ID unset, src/main.cpp derives the unit
; label from the chip's own MAC, so boards still identify themselves uniquely.
; Set UNIT_BUILD_FLAGS to pass -DUNIT_ID=<n> if you want numbered units, and
; accept that each one then has its own binary and its own hash.

lib_deps =
    lovyan03/LovyanGFX@1.2.28
    bblanchon/ArduinoJson@7.4.3

monitor_speed = 115200
monitor_filters = direct
upload_speed = 460800
